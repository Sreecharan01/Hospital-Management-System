services:
  - type: web
    name: hospital-management-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: USE_SQLITE
        value: "False"
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_XHI0r3VbNdEp@ep-blue-voice-bdo8rwfb-pooler.c-8.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require

